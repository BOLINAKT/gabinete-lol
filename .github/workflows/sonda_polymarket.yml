# SONDA DA POLYMARKET (23/10/2026): os dominios dela nao resolvem no Brasil;
# o robo (EUA) le a API publica e grava evidence/sonda_polymarket.json. So
# reconhecimento, para desenhar o coletor com dado real. Roda a mao.
name: Sonda Polymarket

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Sondar
        run: python tools/sonda_polymarket.py
      - name: Commitar
        run: |
          git config user.name "Robo Gabinete"
          git config user.email "robo@gabinete.local"
          git add -f evidence/sonda_polymarket.json
          git diff --cached --quiet && exit 0
          git commit -m "Robô: sonda da Polymarket"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash || exit 1
          done
          git push
