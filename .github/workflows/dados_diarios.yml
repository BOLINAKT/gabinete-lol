# Robô de dados do Gabinete (fase 1): baixa o CSV do Oracle's Elixir e
# commita quando houver jogos novos. PCs se atualizam com `git pull`.
# Disparo manual: aba Actions -> "Dados diários (Oracle's Elixir)" -> Run workflow.
name: Dados diários (Oracle's Elixir)

on:
  schedule:
    # 3 janelas espalhadas (UTC) para driblar a quota rotativa do Drive
    - cron: "17 9 * * *"
    - cron: "23 15 * * *"
    - cron: "41 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dados-diarios
  cancel-in-progress: false

jobs:
  atualizar-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GH_PAT (secret de Actions): commits assinados com PAT DISPARAM o
      # workflow de retreino (com o token padrão o GitHub bloqueia robô
      # acordar robô). Sem o secret, degrada: CSV atualiza, retreino só
      # nas janelas/manual.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do robô
        run: pip install --quiet gdown pandas

      - name: Baixar CSV do Oracle's Elixir
        id: baixar
        run: |
          set +e
          python tools/oe_download.py
          rc=$?
          # rc=75 = quota do Drive (transitório): sai VERDE sem commit;
          # a próxima janela do cron tenta de novo.
          if [ "$rc" = "75" ]; then
            echo "quota do Drive — fica para a próxima janela"
            exit 0
          fi
          exit $rc

      - name: Commitar se houver novidade
        run: |
          git config user.name "Robo Gabinete"
          git config user.email "robo@gabinete.local"
          git add CSV_DIARIO/*.csv
          if git diff --cached --quiet; then
            echo "sem mudança — nada a commitar"
          else
            git commit -m "Robô: CSV diário do Oracle's Elixir atualizado"
            # push com retry: upload manual/retreino podem commitar junto
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push recusado (concorrência) — rebase e retry $i/3"
              git pull --rebase || exit 1
            done
            git push
          fi
